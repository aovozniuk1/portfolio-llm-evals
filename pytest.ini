[pytest]
minversion = 8.0
testpaths = evals
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    safety: prompt-injection / jailbreak resistance tests
    classification: ground-truth label match tests
    consistency: temperature=0 determinism tests
    format: JSON / schema compliance tests
    agent: tool-calling correctness tests
